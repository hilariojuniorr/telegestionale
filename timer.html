<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Conto alla rovescia · TELEGestionale</title>
<script src="config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: testata blu del TG; sotto, la barra con tempo e obiettivo; poi il reparto: asse delle ore a sinistra e una colonna per macchina (pre-espansore, blocchiera, taglio). Il tempo scende verso il basso, i blocchetti si spostano solo in verticale. */
:root {
  --bg: #eef2f8; --surface: #ffffff; --ink: #0d1a2e; --muted: #56627a; --line: #d2d9e6; --line-soft: #e5eaf2; --line-strong: #b9c3d4;
  --brand: #0b2a5b; --brand-ink: #ffffff; --accent: #c8102e; --ok: #0f7446; --ok-bg: #dcf2e6; --bad: #c8102e; --bad-bg: #fde7ea;
  --jA: #2f62c9; --jB: #8f6200; --jC: #0d7a6e; --jD: #7347ba; --jE: #b83a72; --j-ink: #ffffff;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --hp: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07101e; --surface: #0f1c31; --ink: #eef2f9; --muted: #9babc4; --line: #24344e; --line-soft: #172640; --line-strong: #34486a;
    --brand: #143c78; --brand-ink: #ffffff; --accent: #ff5364; --ok: #4bd497; --ok-bg: #0f3828; --bad: #ff6b78; --bad-bg: #44161c;
    --jA: #86a8ff; --jB: #f2bd55; --jC: #55d3c1; --jD: #bb9bff; --jE: #ff8fbf; --j-ink: #08111f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07101e; --surface: #0f1c31; --ink: #eef2f9; --muted: #9babc4; --line: #24344e; --line-soft: #172640; --line-strong: #34486a;
  --brand: #143c78; --brand-ink: #ffffff; --accent: #ff5364; --ok: #4bd497; --ok-bg: #0f3828; --bad: #ff6b78; --bad-bg: #44161c;
  --jA: #86a8ff; --jB: #f2bd55; --jC: #55d3c1; --jD: #bb9bff; --jE: #ff8fbf; --j-ink: #08111f;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.top { background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; gap: .8em; padding-block: .55em; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.logo { font-family: var(--display); font-weight: 800; font-size: 1.35em; text-transform: uppercase; letter-spacing: .02em; display: flex; align-items: center; gap: .45em; white-space: nowrap; text-decoration: none; }
.logo i { width: .55em; height: .55em; border-radius: 50%; background: #c8102e; display: inline-block; box-shadow: 0 0 0 .18em rgba(255,255,255,.25); }
.scene { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
main { padding-block: 1.4em 2.5em; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.1em; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.4em, 8vw, 4.6em); line-height: .95; margin: 0; text-transform: uppercase; text-wrap: balance; }
.kicker { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.note { color: var(--muted); font-size: .9em; margin: 0; }


html, body { height: 100%; }
body { display: flex; flex-direction: column; }
main { flex: 1; display: flex; }
.wrap { flex: 1; justify-content: center; align-items: center; text-align: center; gap: 1.2em; }
.clock { font-family: var(--display); font-weight: 800; font-size: min(30vw, 40vh); line-height: .85; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.clock.warn { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .clock.last { animation: pulse 1s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .55; } }
.bar { width: min(90vw, 56em); height: .7em; background: var(--line); }
.bar i { display: block; height: 100%; background: var(--brand); width: 100%; transform-origin: left; }
.bar i.warn { background: var(--accent); }
.msg { font-family: var(--display); font-weight: 700; font-size: clamp(1.4em, 3.5vw, 2.6em); text-transform: uppercase; letter-spacing: .04em; min-height: 1.2em; }
.ctrl { display: flex; gap: .6em; flex-wrap: wrap; justify-content: center; }
.btn { font: inherit; color: inherit; border: 1px solid var(--line-strong); background: var(--surface); padding: .6em 1.2em; font-weight: 600; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.keys { color: var(--muted); font-size: .85em; }
.sync { font-size: .9em; color: var(--muted); display: flex; gap: .5em; align-items: center; flex-wrap: wrap; justify-content: center; margin: 0; }
.sync.ok { color: var(--ok); }
.sync.ko { color: var(--accent); }
.sync input { font: inherit; color: inherit; padding: .35em .6em; border: 1px solid var(--line-strong); background: var(--surface); width: 9em; }
</style>
</head>
<body>
<header class="top"><span class="logo"><i></i>TELEGestionale</span><span class="scene">Il gioco · tempo</span></header>
<main><div class="wrap">
  <div class="kicker">Tre macchine in fila · obiettivo ora 22</div>
  <div class="clock" id="clock" role="timer" aria-live="off">6:00</div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <div class="msg" id="msg" aria-live="polite">Pronti?</div>
  <div class="ctrl">
    <button class="btn primary" type="button" id="start">Avvia</button>
    <button class="btn" type="button" id="plus">+1 minuto</button>
    <button class="btn" type="button" id="reset">Azzera</button>
    <a class="btn" href="classifica.html" id="toRank">Vai alla classifica</a>
  </div>
  <p class="keys">Spazio: avvia o metti in pausa · R: azzera</p>
  <form class="sync" id="sync" novalidate></form>
</div></main>
<script>
(function () {
  var TOTAL = 6 * 60;
  var $ = function (id) { return document.getElementById(id); };
  var total = TOTAL, left = TOTAL, running = false, endAt = 0, iv = 0;
  function fmt(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function paint() {
    var c = $("clock"), b = $("bar"), sec = Math.max(0, Math.ceil(left));
    c.textContent = fmt(left);
    var warn = sec <= 60 && sec > 0;
    c.classList.toggle("warn", sec <= 60);
    c.classList.toggle("last", sec <= 30 && sec > 0 && running);
    b.style.width = Math.max(0, left / total * 100) + "%";
    b.classList.toggle("warn", sec <= 60);
    var m = $("msg");
    if (left <= 0) m.textContent = "Tempo scaduto: consegnate il piano";
    else if (!running && left === total) m.textContent = "Pronti?";
    else if (!running) m.textContent = "In pausa";
    else if (sec <= 30) m.textContent = "Ultimi 30 secondi";
    else if (warn) m.textContent = "Manca un minuto";
    else m.textContent = "Consegnate appena avete un piano valido, poi migliorate";
    $("start").textContent = running ? "Pausa" : (left < total && left > 0 ? "Riprendi" : "Avvia");
    $("start").disabled = left <= 0;
  }
  function stop() { running = false; clearInterval(iv); }
  function run() { running = true; endAt = Date.now() + left * 1000; clearInterval(iv); iv = setInterval(tick, 200); tick(); }
  function tick() {
    if (!running) return;
    left = (endAt - Date.now()) / 1000;
    if (left <= 0) { left = 0; stop(); push("done"); }
    paint();
  }
  function toggle() {
    if (left <= 0) return;
    if (running) { left = (endAt - Date.now()) / 1000; stop(); paint(); push("paused"); }
    else { run(); push("running"); }
  }
  function reset() { stop(); total = TOTAL; left = TOTAL; paint(); push("idle"); }
  function plus() {
    total += 60;
    if (running) endAt += 60000; else left += 60;
    paint(); push(running ? "running" : "paused");
  }

  /* collegamento con i telefoni: lo stato del tempo va allo script Google */
  var url = (window.TG_CONFIG && window.TG_CONFIG.API_URL) || "";
  var key = ""; try { key = localStorage.getItem("tg-regia") || ""; } catch (e) {}
  var syncMsg = "";
  function renderSync() {
    var f = $("sync");
    if (!url) { f.className = "sync"; f.textContent = "Tempo visibile solo su questo schermo: lo script Google non è collegato."; return; }
    if (syncMsg === "old") { f.className = "sync ko"; f.textContent = "Lo script Google è alla versione vecchia: fate Gestisci deployment → Nuova versione."; return; }
    if (!key) {
      f.className = "sync";
      f.innerHTML = '<label for="regia">Codice regia, per mostrare il tempo sui telefoni</label><input id="regia" type="password" autocomplete="off"><button class="btn" type="submit">Collega</button>';
      return;
    }
    f.className = "sync" + (syncMsg === "ok" ? " ok" : syncMsg === "key" || syncMsg === "net" || syncMsg === "old" ? " ko" : "");
    f.innerHTML = syncMsg === "ok" ? "Tempo collegato ai telefoni" :
      syncMsg === "key" ? 'Codice regia sbagliato. <button class="btn" type="button" id="rekey">Reinserisci</button>' :
      syncMsg === "net" ? "Telefoni non raggiunti: riprovo al prossimo comando." :
      syncMsg === "old" ? "Lo script Google è alla versione vecchia: fate Gestisci deployment → Nuova versione." : "Codice regia salvato: premete Avvia";
    var rk = $("rekey"); if (rk) rk.addEventListener("click", function () { key = ""; try { localStorage.removeItem("tg-regia"); } catch (e) {} renderSync(); });
  }
  $("sync").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = ($("regia") && $("regia").value || "").trim(); if (!v) return;
    key = v; try { localStorage.setItem("tg-regia", key); } catch (err) {}
    syncMsg = ""; renderSync(); push(running ? "running" : (left >= total ? "idle" : "paused"));
  });
  function push(st) {
    if (!url || !key) return;
    var rem = running ? Math.max(0, (endAt - Date.now()) / 1000) : left;
    fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "timer", key: key, state: st, remaining: rem, total: total }) })
      .then(function (r) { return r.json(); })
      .then(function (d) { syncMsg = d && d.ok ? "ok" : (d && d.error === "key" ? "key" : "net"); renderSync(); })
      .catch(function () { syncMsg = "net"; renderSync(); });
  }
  /* se la pagina viene ricaricata, riprende il tempo già avviato */
  if (url) fetch(url + (url.indexOf("?") >= 0 ? "&" : "?") + "t=1", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
    if (!d || !d.ok) return;
    if (typeof d.state !== "string" || typeof d.remaining !== "number") { syncMsg = "old"; renderSync(); return; }
    if (d.state === "idle" || running) return;
    total = Math.max(Number(d.total) || TOTAL, 1); left = Number(d.remaining) || 0;
    if (d.state === "running" && left > 0) run(); else paint();
  }).catch(function () {});
  $("start").addEventListener("click", toggle);
  $("reset").addEventListener("click", reset);
  $("plus").addEventListener("click", plus);
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.key === " " || e.code === "Space") { e.preventDefault(); toggle(); }
    if (e.key === "r" || e.key === "R") reset();
  });
  paint(); renderSync();
})();
</script>
</body>
</html>
