<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Presentazione · TELEGestionale</title>
<script src="config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: uno schermo da telegiornale per il proiettore. Testata blu in alto, palco centrale che cambia scena, sottopancia sottile con i comandi di regia. */
:root {
  --bg: #eef2f8; --surface: #ffffff; --ink: #0d1a2e; --muted: #56627a; --line: #d2d9e6; --line-soft: #e5eaf2; --line-strong: #b9c3d4;
  --brand: #0b2a5b; --brand-ink: #ffffff; --accent: #c8102e; --ok: #0f7446; --ok-bg: #dcf2e6; --idle: #dfe5ef;
  --jA: #2f62c9; --jB: #8f6200; --jC: #0d7a6e; --jD: #7347ba; --jE: #b83a72; --j-ink: #ffffff;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  --bg: #07101e; --surface: #0f1c31; --ink: #eef2f9; --muted: #9babc4; --line: #24344e; --line-soft: #172640; --line-strong: #34486a;
  --brand: #143c78; --brand-ink: #ffffff; --accent: #ff5364; --ok: #4bd497; --ok-bg: #0f3828; --idle: #16243b;
  --jA: #86a8ff; --jB: #f2bd55; --jC: #55d3c1; --jD: #bb9bff; --jE: #ff8fbf; --j-ink: #08111f;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: clamp(15px, 1.3vw, 26px); line-height: 1.4; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
.top { background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; gap: 1em; padding: .5em 1.2em; }
.logo { font-family: var(--display); font-weight: 800; font-size: 1.5em; letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: center; gap: .45em; white-space: nowrap; }
.logo i { width: .55em; height: .55em; border-radius: 50%; background: #c8102e; display: inline-block; box-shadow: 0 0 0 .18em rgba(255,255,255,.25); }
.scene { font-family: var(--display); font-weight: 600; font-size: 1.15em; text-transform: uppercase; letter-spacing: .08em; opacity: .9; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.right { margin-left: auto; display: flex; align-items: center; gap: .8em; }
.chip { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; background: rgba(255,255,255,.14); padding: .1em .6em; }
.chip.warn { background: #c8102e; }
.clock { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.stage { overflow: auto; padding: clamp(16px, 3vw, 56px); display: flex; }
.stage > section { margin: auto; width: 100%; max-width: 1500px; display: flex; flex-direction: column; gap: 1.1em; min-width: 0; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.2em, 5.6vw, 5em); line-height: .98; margin: 0; text-transform: uppercase; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 700; font-size: clamp(1.6em, 3.4vw, 3em); line-height: 1.05; margin: 0; text-wrap: balance; }
.kicker { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); font-size: 1.1em; }
.lead { font-size: 1.3em; max-width: 52ch; margin: 0; }
.note { color: var(--muted); font-size: .85em; margin: 0; }
.src { color: var(--muted); font-size: .72em; font-family: var(--mono); }
@media (prefers-reduced-motion: no-preference) { .in { animation: fadeUp .5s cubic-bezier(.2,.8,.2,1) both; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(.5em); } to { opacity: 1; transform: none; } }

/* sigla */
.sigla { background: var(--brand); color: #ffffff; flex: 1; min-height: 62vh; display: grid; place-items: center; text-align: center; padding: 2em 1.5em; position: relative; overflow: hidden; }
.stage > section.sigla { max-width: none; margin: 0; align-self: stretch; justify-content: center; align-items: center; }
.sigla::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.14), transparent 60%); }
.sigla-in { position: relative; display: flex; flex-direction: column; align-items: center; gap: .9em; min-width: 0; max-width: 100%; }
.sigla-dot { width: 1.6em; height: 1.6em; border-radius: 50%; background: #c8102e; box-shadow: 0 0 0 .35em rgba(255,255,255,.22); font-size: clamp(1.4em, 3vw, 2.6em); }
.sigla-name { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .03em; line-height: .95; font-size: clamp(2.6em, 9vw, 8.5em); overflow-wrap: anywhere; }
.sigla-name span { color: #ff5364; }
.sigla-line { height: .3em; width: min(70vw, 28em); background: #c8102e; transform-origin: left center; }
.sigla-sub { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .14em; font-size: clamp(1em, 1.8vw, 1.6em); opacity: .92; }
.sigla-date { font-family: var(--mono); font-size: .95em; opacity: .8; }
@media (prefers-reduced-motion: no-preference) {
  .sigla-dot { animation: sgDot 1.2s cubic-bezier(.2,.9,.3,1.3) both, sgPulse 1.6s ease-in-out 1.4s infinite; }
  .sigla-name { animation: sgUp .9s cubic-bezier(.2,.8,.2,1) 1.1s both; }
  .sigla-line { animation: sgLine .8s cubic-bezier(.6,0,.2,1) 1.6s both; }
  .sigla-sub { animation: sgFade .8s ease 2.6s both; }
  .sigla-date { animation: sgFade .8s ease 4.3s both; }
}
.sigla-wait { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .2em; font-size: clamp(1em, 2vw, 1.8em); opacity: .85; }
@media (prefers-reduced-motion: no-preference) { .sigla-wait-dot { animation: sgPulse 1.6s ease-in-out infinite; } }
.sound[aria-pressed="false"] { text-decoration: line-through; }
@keyframes sgDot { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes sgPulse { 50% { box-shadow: 0 0 0 .8em rgba(255,255,255,0); } }
@keyframes sgUp { from { opacity: 0; transform: translateY(.4em) scale(.96); letter-spacing: .3em; } to { opacity: 1; transform: none; } }
@keyframes sgLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes sgFade { from { opacity: 0; transform: translateY(.3em); } to { opacity: .92; transform: none; } }

/* notizie */
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(13em, 1fr)); gap: 1.2em; }
.figure { border-top: .28em solid var(--brand); padding-top: .5em; min-width: 0; }
.figure b { display: block; font-family: var(--display); font-weight: 800; font-size: clamp(2em, 4.4vw, 4em); line-height: 1; font-variant-numeric: tabular-nums; }
.figure span { color: var(--muted); }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1em; }
.three div { background: var(--surface); border: 1px solid var(--line); padding: 1em; min-width: 0; display: flex; flex-direction: column; gap: .3em; }
.three b { font-family: var(--display); font-size: 1.5em; line-height: 1.1; }
.answer { border-left: .35em solid var(--accent); background: var(--surface); padding: .8em 1.1em; font-size: 1.35em; max-width: 52ch; }
.answer b { color: var(--accent); }

/* stabilimento */
.flow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); gap: .6em; align-items: stretch; }
.mach { background: var(--surface); border: 1px solid var(--line); border-top: .35em solid var(--brand); padding: .8em 1em; display: flex; flex-direction: column; gap: .25em; min-width: 0; }
.mach b { font-family: var(--display); font-weight: 800; font-size: 1.8em; line-height: 1; text-transform: uppercase; }
.mach span { color: var(--muted); }
.arrow { align-self: center; font-family: var(--display); font-weight: 800; font-size: 2.4em; color: var(--accent); }
table.jobs { border-collapse: collapse; width: 100%; background: var(--surface); border: 1px solid var(--line); }
.jobs th, .jobs td { padding: .35em .8em; text-align: left; border-bottom: 1px solid var(--line-soft); }
.jobs th { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-size: .85em; }
.jobs td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; width: 9em; }
.jobs th.n { text-align: right; }
.jobs tr:last-child td { border-bottom: 0; }
.sw { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; font-family: var(--display); font-weight: 800; color: var(--j-ink); margin-right: .6em; vertical-align: middle; }
.rules { display: flex; gap: .3em 2em; flex-wrap: wrap; margin: 0; padding: 0; list-style: none; font-weight: 500; font-size: 1.1em; }
.rules li::before { content: "▸ "; color: var(--accent); }

/* diagramma del piano di partenza */
.gantt { display: grid; grid-template-columns: 9em minmax(0, 1fr); gap: .5em .8em; align-items: center; }
.glab { font-family: var(--display); font-weight: 700; font-size: 1.25em; text-transform: uppercase; letter-spacing: .03em; }
.lane { position: relative; height: 3em; background: var(--idle); }
.blk { position: absolute; top: 0; bottom: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.3em; color: var(--j-ink); border-right: 2px solid var(--bg); }
.axis { position: relative; height: 1.5em; font-family: var(--mono); font-size: .75em; color: var(--muted); font-variant-numeric: tabular-nums; }
.axis span { position: absolute; transform: translateX(-50%); }
.axis span:first-child { transform: none; }
.mark { position: absolute; top: -.4em; bottom: -.4em; width: 0; border-left: 3px dashed var(--accent); z-index: 1; }
.mark.end { border-left-style: solid; border-color: var(--ink); }
.mark span { position: absolute; top: -1.5em; left: 0; transform: translateX(-50%); font-family: var(--mono); font-size: .7em; font-weight: 600; white-space: nowrap; background: var(--bg); padding: 0 .3em; }
.mark.goal span { color: var(--accent); }
.gwrap { position: relative; padding-top: 1.6em; }
.verdict { display: flex; align-items: center; gap: 1.2em; flex-wrap: wrap; }
.big { font-family: var(--display); font-weight: 800; font-size: clamp(3.4em, 9vw, 8em); line-height: .85; font-variant-numeric: tabular-nums; }
.big.goal { color: var(--accent); }
.verdict p { margin: 0; font-size: 1.25em; max-width: 30ch; }

/* gioco */
.open { display: grid; grid-template-columns: 1.3fr minmax(0, 1fr); gap: 2.4em; align-items: center; }
.qrbox { background: #ffffff; color: #0d1a2e; padding: 1em; border: 1px solid var(--line); text-align: center; min-width: 0; }
.qrbox svg { width: 100%; height: auto; max-width: 22em; display: block; margin: 0 auto; }
.qrbox p { margin: .5em 0 0; font-family: var(--mono); font-weight: 600; font-size: .8em; overflow-wrap: anywhere; }
.steps3 { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .8em; counter-reset: g; }
.steps3 li { counter-increment: g; display: grid; grid-template-columns: 1.9em minmax(0, 1fr); gap: .6em; align-items: start; font-size: 1.2em; }
.steps3 li::before { content: counter(g); font-family: var(--display); font-weight: 800; font-size: 1.3em; line-height: 1.15; text-align: center; background: var(--brand); color: var(--brand-ink); }
.steps3 b { font-weight: 600; }
.goalbox { display: flex; align-items: center; gap: 1em; background: var(--surface); border: 1px solid var(--line); border-left: .35em solid var(--accent); padding: .7em 1em; font-size: 1.2em; }
.goalbox b { font-family: var(--display); font-weight: 800; font-size: 2em; line-height: 1; color: var(--accent); }

/* tempo */
.timer { align-items: center; text-align: center; }
.tclock { font-family: var(--display); font-weight: 800; font-size: min(26vw, 38vh); line-height: .85; font-variant-numeric: tabular-nums; }
.tclock.warn { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .tclock.last { animation: pulse 1s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .55; } }
.tbar { width: min(90vw, 56em); height: .7em; background: var(--line); }
.tbar i { display: block; height: 100%; background: var(--brand); }
.tbar i.warn { background: var(--accent); }
.tmsg { font-family: var(--display); font-weight: 700; font-size: clamp(1.4em, 3vw, 2.4em); text-transform: uppercase; letter-spacing: .04em; min-height: 1.2em; }
.ctrl { display: flex; gap: .5em; flex-wrap: wrap; justify-content: center; font-size: .8em; }
.sync { font-size: .75em; color: var(--muted); display: flex; gap: .5em; align-items: center; flex-wrap: wrap; justify-content: center; margin: 0; min-height: 2em; }
.sync.ok { color: var(--ok); } .sync.ko { color: var(--accent); }
.sync input { padding: .35em .6em; border: 1px solid var(--line-strong); background: var(--surface); width: 9em; }

/* classifica */
.head { display: flex; align-items: end; justify-content: space-between; gap: 1em; flex-wrap: wrap; }
.count { font-family: var(--display); font-weight: 700; font-size: 1.3em; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.count b { color: var(--ink); font-size: 1.6em; font-variant-numeric: tabular-nums; }
.board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: column; grid-template-rows: repeat(5, auto); gap: .45em 1em; margin: 0; padding: 0; list-style: none; }
.row { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto auto; gap: .8em; align-items: center; background: var(--surface); border: 1px solid var(--line); padding: .45em .9em; }
.row .pos { font-family: var(--display); font-weight: 800; font-size: 1.8em; line-height: 1; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .nm { font-family: var(--display); font-weight: 700; font-size: 1.5em; line-height: 1.1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm small { font-family: var(--mono); font-weight: 500; font-size: .5em; color: var(--muted); }
.row .end { font-family: var(--display); font-weight: 800; font-size: 1.5em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .end small { font-size: .55em; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-right: .3em; }
.row .tm { font-family: var(--mono); font-size: .9em; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.first { border: 2px solid var(--accent); }
.row.first .pos { color: var(--accent); }
.row.hit .end { color: var(--ok); }
.state { background: var(--surface); border: 1px dashed var(--line-strong); padding: 1.4em; text-align: center; color: var(--muted); font-size: 1.1em; }

/* concetti */
.concept { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 1.4em; align-items: start; }
.cnum { font-family: var(--display); font-weight: 800; font-size: clamp(5em, 12vw, 10.5em); line-height: .8; color: var(--accent); font-variant-numeric: tabular-nums; }
.cbody { display: flex; flex-direction: column; gap: .9em; min-width: 0; }
.cbody h1 { font-size: clamp(2em, 4.6vw, 4.2em); }
.figures.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.figures.sm b { font-size: clamp(1.8em, 3.4vw, 3em); }
@media (max-width: 820px) { .figures.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ingame { background: var(--surface); border: 1px solid var(--line); border-left: .35em solid var(--brand); padding: .8em 1.1em; font-size: 1.2em; max-width: 56ch; }
.ingame b.t { display: block; font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-size: .8em; }
.dots { display: flex; gap: .4em; }
.dots i { width: 2.2em; height: .35em; background: var(--line); }
.dots i.on { background: var(--accent); }
.recap { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .55em; counter-reset: r; }
.recap li { counter-increment: r; display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: .7em; align-items: baseline; font-family: var(--display); font-weight: 700; font-size: clamp(1.4em, 2.9vw, 2.5em); line-height: 1.1; background: var(--surface); border: 1px solid var(--line); padding: .35em .6em; }
.recap li::before { content: counter(r); color: var(--accent); font-weight: 800; text-align: center; }

/* chiusura */
.huge { font-family: var(--mono); font-weight: 600; font-size: clamp(1.1em, 3.4vw, 3em); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.name { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: clamp(3em, 10vw, 9em); line-height: .9; color: var(--accent); }
.quiet { align-items: flex-start; }
.quiet h1 { font-size: clamp(2.6em, 6.5vw, 6em); }
.final { font-family: var(--display); font-weight: 800; font-size: clamp(2.4em, 6vw, 5.4em); line-height: 1; text-transform: uppercase; text-wrap: balance; border-left: .12em solid var(--accent); padding-left: .4em; }

/* sottopancia */
.bottom { background: var(--bg); border-top: .25em solid var(--accent); padding: .3em 1.2em; padding-bottom: calc(.3em + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; justify-content: flex-end; gap: .5em; font-size: .7em; }
.steps { margin-right: auto; font-family: var(--mono); font-size: .8em; color: var(--muted); font-variant-numeric: tabular-nums; }
.bottom .btn { padding: .35em .8em; opacity: .55; }
.bottom .btn:hover, .bottom .btn:focus-visible { opacity: 1; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); padding: .55em 1.1em; font-weight: 600; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

@media (max-width: 820px) {
  .open, .three { grid-template-columns: minmax(0, 1fr); }
  .flow { grid-template-columns: minmax(0, 1fr); }
  .arrow { transform: rotate(90deg); justify-self: center; }
  .board { grid-template-columns: minmax(0, 1fr); grid-auto-flow: row; grid-template-rows: none; }
  .gantt { grid-template-columns: 5.5em minmax(0, 1fr); }
  .concept { grid-template-columns: minmax(0, 1fr); }
  .jobs td.n { width: auto; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><i></i>TELEGestionale</div>
    <div class="scene" id="scene"></div>
    <div class="right"><span class="chip" id="chip" hidden></span><span class="clock" id="clock" aria-hidden="true"></span></div>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="bottom">
    <span class="steps" id="steps"></span>
    <button class="btn sound" id="sound" type="button" aria-pressed="true" title="Audio sì o no (tasto M)">Audio</button>
    <button class="btn" id="prev" type="button">Indietro</button>
    <button class="btn primary" id="next" type="button">Avanti</button>
  </footer>
</div>
<script>
/* Generatore di codici QR: modalità byte, correzione M, versioni 1-10. */
var qrcode = (function () {
  var TOTAL = [0, 26, 44, 70, 100, 134, 172, 196, 242, 292, 346];
  var ECLEN = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
  var NBLK = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  var ALIGN = [[], [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50]];
  var EXP = [], LOG = [];
  (function () { var x = 1; for (var i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11d; } })();
  function mul(a, b) { return a && b ? EXP[(LOG[a] + LOG[b]) % 255] : 0; }
  function rsGen(deg) {
    var g = [1];
    for (var i = 0; i < deg; i++) {
      var n = [];
      for (var j = 0; j <= g.length; j++) n[j] = (j < g.length ? mul(g[j], EXP[i]) : 0) ^ (j > 0 ? g[j - 1] : 0);
      g = n;
    }
    return g; /* coefficienti dal grado 0 al grado deg */
  }
  function rsRemainder(data, deg) {
    var g = rsGen(deg), rem = [];
    for (var i = 0; i < deg; i++) rem[i] = 0;
    data.forEach(function (b) {
      var f = b ^ rem.shift(); rem.push(0);
      for (var j = 0; j < deg; j++) rem[j] ^= mul(g[deg - 1 - j], f);
    });
    return rem;
  }
  function build(text) {
    var bytes = Array.prototype.slice.call(new TextEncoder().encode(text));
    var v = 0;
    for (var k = 1; k <= 10; k++) { if (bytes.length <= TOTAL[k] - ECLEN[k] * NBLK[k] - (k < 10 ? 2 : 3)) { v = k; break; } }
    if (!v) throw new Error("testo troppo lungo");

    if (state.stage > 0) { state.stage--; state.step = (STAGES[state.stage].steps || 1) - 1; render(p); }
    if (!isScene("Sigla")) fadeOut("sigla", 400);
  }
  $("sound").addEventListener("click", toggleSound);
  $("next").addEventListener("click", next);
  $("prev").addEventListener("click", prev);
  $("stage").addEventListener("click", function (e) {
    var id = e.target && e.target.id;
    if (id === "tstart") toggleT(); else if (id === "tplus") plusT(); else if (id === "treset") resetT();
  });
  $("stage").addEventListener("submit", function (e) {
    if (e.target.id !== "tsync") return;
    e.preventDefault();
    var v = ($("regia") && $("regia").value || "").trim(); if (!v) return;
    key = v; try { localStorage.setItem("tg-regia", key); } catch (err) {}
    syncMsg = ""; renderSync(); push(running ? "running" : (left >= total ? "idle" : "paused"));
  });
  document.addEventListener("keydown", function (e) {
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === "ArrowDown") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp" || e.key === "ArrowUp") { e.preventDefault(); prev(); }
    else if ((e.key === " " || e.code === "Space") && isScene("Il gioco · tempo")) { e.preventDefault(); toggleT(); }
    else if (e.key === " " || e.code === "Space") { e.preventDefault(); next(); }
    else if (e.key === "f" || e.key === "F") { var el = document.documentElement; if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function () {}); else if (document.exitFullscreen) document.exitFullscreen().catch(function () {}); }
    else if (e.key === "d" || e.key === "D") { var r = document.documentElement; r.setAttribute("data-theme", r.getAttribute("data-theme") === "dark" ? "light" : "dark"); }
    else if (e.key === "m" || e.key === "M") toggleSound();
    else if (e.key === "Home") { stopAll(); var p = state.stage; state.stage = 0; state.step = 0; render(p); }
  });
  function clock() { var d = new Date(); $("clock").textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  clock(); setInterval(clock, 15000);
  paintSound();
  render(null);
})();
</script>
